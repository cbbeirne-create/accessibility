version: '3.8'

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  MONGO_URL: mongodb://mongodb:27017
  DB_NAME: accessibility_scanner
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SENDER_EMAIL: ${SENDER_EMAIL:-noreply@auditly.com}
  EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-}
  EVIDENCE_S3_PREFIX: ${EVIDENCE_S3_PREFIX:-auditly-evidence}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  AWS_REGION: ${AWS_REGION:-eu-west-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  mongodb:
    image: mongo:7.0
    container_name: accessibility_scanner_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: accessibility_scanner
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - scanner_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/accessibility_scanner --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: accessibility_scanner_backend
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - scanner_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - scanner_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8000}
    container_name: accessibility_scanner_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - scanner_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongodb_data:

networks:
  scanner_network:
    driver: bridge
