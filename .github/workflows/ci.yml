name: CI

on:
  push:
    branches: [main, production-hardening-2026-09-11]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-tests
      ENVIRONMENT: development
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: auditly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend regression tests
        run: pytest -q backend/tests/test_security_primitives.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -f backend/Dockerfile -t auditly-backend-ci .
      - name: Build frontend container
        run: docker build -f frontend/Dockerfile -t auditly-frontend-ci frontend
